<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>إدارة شئون الطلاب</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {font-family: Cairo; background:#f4f6f9; direction:rtl; text-align:right;}
    .container {width:900px; margin:40px auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
    h2 {text-align:center; color:#333;}
    label {display:block; margin:10px 0 5px; font-weight:bold;}
    input, select {width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;}
    button {margin-top:15px; padding:10px 15px; background:#007bff; color:#fff; border:none; border-radius:6px; cursor:pointer;}
    button:hover {background:#0056b3;}
    #result {margin-top:20px; padding:10px; background:#e9ecef; border-radius:6px;}
    table {margin-top:20px; border:1px solid #ccc; width:100%; border-collapse:collapse; text-align:center;}
    th, td {padding:8px; border:1px solid #ccc;}
    tr:nth-child(even){background:#f9f9f9;}
    tr:hover{background:#e0f0ff;}
    th{background:#007bff; color:#fff;}
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 إدارة شئون الطلاب</h2>
    <h2> إعداد روماني رؤوف</h2>
    <form id="studentForm">
      <label>الاسم:</label><input type="text" id="name">
      <label>الكود:</label><input type="text" id="code">
      <label>الرقم القومي:</label>
<input type="text" id="nid" oninput="fillDataFromNID()">

<label>تاريخ الميلاد (تلقائي):</label>
<input type="text" id="birthdate" readonly>

<label>النوع (تلقائي):</label>
<input type="text" id="gender" readonly>

<label>تاريخ الأساس (مثلاً 01-10-2026):</label>
<input type="date" id="baseDate" onchange="updateAge()">

<label>السن في التاريخ:</label>
<input type="text" id="ageDays" readonly placeholder="أيام">
<input type="text" id="ageMonths" readonly placeholder="شهور">
<input type="text" id="ageYears" readonly placeholder="سنوات">
      <label>الديانة:</label>
      <select id="religion">
        <option value="">اختر الديانة</option>
        <option value="مسلم">مسلم</option>
        <option value="مسيحي">مسيحي</option>
      </select>
      <label>اسم ولي الأمر:</label><input type="text" id="guardian">
      <label>وظيفة ولي الأمر:</label><input type="text" id="guardianJob">
<label>الحالة الاجتماعية:</label>
<select id="status">
  <option value="">-- اختر الحالة --</option>
  <option value="شئون">شئون</option>
  <option value="أيتام">أيتام</option>
  <option value="أبناء عاملين">أبناء عاملين</option>
  <option value="تنمية مجتمع">تنمية مجتمع</option>
  <option value="دمج">دمج</option>
</select>

      <label>العنوان:</label><input type="text" id="address">
      <label>المدرسة:</label><input type="text" id="school">
      <label>المجموع:</label><input type="number" id="total">
      <label>اسم الأم:</label><input type="text" id="mother">
      <label>الرقم القومي للأب:</label><input type="text" id="fatherNID">
      <label>الرقم القومي للأم:</label><input type="text" id="motherNID">
      <label>الصف (تلقائي):</label><input type="text" id="grade" readonly>
      <button type="button" onclick="addStudent()">➕ إضافة الطالب</button>
    </form>

    <h2>🔍 بحث عن طالب</h2>
    <input type="text" id="searchName" placeholder="اكتب جزء من الاسم">
    <button onclick="searchStudent()">بحث</button>

    <div id="result"></div>
    <button onclick="exportExcel()">📤 تصدير لإكسل</button>
    <button onclick="printReport()">🖨️ طباعة التقرير</button>

  </div>
  

 
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbydTgAzM0LfXOxQjd8FdImIbFYue0auOvcztxIZM3DMoUXaFrUPeXnM2MsbFZINwSqo/exec";

  // 🟢 دالة حساب العمر
  function calculateAge(birthDate, baseDate) {
    const b = new Date(birthDate);
    const d = new Date(baseDate);

    let years = d.getFullYear() - b.getFullYear();
    let months = d.getMonth() - b.getMonth();
    let days = d.getDate() - b.getDate();

    if (days < 0) {
      months--;
      days += new Date(d.getFullYear(), d.getMonth(), 0).getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }

    return { years, months, days };
  }

  // 🟢 دالة استخراج البيانات من الرقم القومي
  function fillDataFromNID() {
    const nid = document.getElementById("nid").value.trim();
    if (nid.length < 14) return;

    const century = nid.substring(0,1) === "2" ? "19" : "20";
    const year = nid.substring(1,3);
    const month = nid.substring(3,5);
    const day = nid.substring(5,7);
    const birthDate = `${century}${year}-${month}-${day}`;

    const genderDigit = parseInt(nid.substring(12,13));
    const gender = (genderDigit % 2 === 0) ? "أنثى" : "ذكر";

    document.getElementById("birthdate").value = birthDate;
    document.getElementById("gender").value = gender;

    // تحديث العمر مباشرة لو فيه تاريخ أساس
    updateAge();
  }

  // 🟢 دالة تحديث العمر عند تغيير التاريخ الأساسي
  function updateAge() {
    const birthDate = document.getElementById("birthdate").value;
    const baseDate = document.getElementById("baseDate").value;
    if (!birthDate || !baseDate) return;

    const age = calculateAge(birthDate, baseDate);
    document.getElementById("ageDays").value = age.days;
    document.getElementById("ageMonths").value = age.months;
    document.getElementById("ageYears").value = age.years;
  }
  // 🟢 دالة إضافة الطالب
  function addStudent() {
    const nid = document.getElementById("nid").value.trim();
    const birthDate = document.getElementById("birthdate").value;
    const gender = document.getElementById("gender").value;

    let grade = "";
    const school = document.getElementById("school").value.trim();
    const total = document.getElementById("total").value.trim();
    if (school.includes("ثانوي") && total >= 200) grade = "الصف الأول الثانوي";
    document.getElementById("grade").value = grade;

    const student = {
      name: document.getElementById("name").value.trim(),
      studentCode: document.getElementById("studentCode").value.trim(),
      nid: nid,
      birthdate: birthDate,
      gender: gender,
      ageDays: document.getElementById("ageDays").value,
      ageMonths: document.getElementById("ageMonths").value,
      ageYears: document.getElementById("ageYears").value,
      religion: document.getElementById("religion").value,
      guardian: document.getElementById("guardian").value.trim(),
      guardianJob: document.getElementById("guardianJob").value.trim(),
      status: document.getElementById("status").value,
      address: document.getElementById("address").value.trim(),
      school: school,
      total: total,
      mother: document.getElementById("mother").value.trim(),
      fatherNID: document.getElementById("fatherNID").value.trim(),
      motherNID: document.getElementById("motherNID").value.trim(),
      grade: grade,
      studentEmail: document.getElementById("studentEmail").value.trim(),
      studentPassword: document.getElementById("studentPassword").value.trim()
    };

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(student)
    })
    .then(res => res.text())
    .then(msg => { document.getElementById("result").innerText = msg; })
    .catch(err => { document.getElementById("result").innerText = "❌ خطأ في الاتصال بالشيت"; });
  }

  // 🟢 دالة البحث
  function searchStudent() {
    const name = document.getElementById("searchName").value.trim();
    fetch(API_URL + "?search=" + encodeURIComponent(name))
      .then(res => res.json())
      .then(data => {
        let table = "<table id='studentsTable'><tr><th>الاسم</th><th>الكود</th><th>الرقم القومي</th><th>تاريخ الميلاد</th><th>أيام</th><th>شهور</th><th>سنوات</th><th>النوع</th><th>الديانة</th><th>ولي الأمر</th><th>وظيفة ولي الأمر</th><th>الحالة الاجتماعية</th><th>العنوان</th><th>المدرسة</th><th>المجموع</th><th>اسم الأم</th><th>رقم قومي الأب</th><th>رقم قومي الأم</th><th>الصف</th><th>البريد الموحد</th><th>كلمة السر</th></tr>";
        data.forEach(s => {
          table += `<tr>
            <td>${s.name||""}</td>
            <td>${s.studentCode||""}</td>
            <td>${s.nid||""}</td>
            <td>${s.birthdate||""}</td>
            <td>${s.ageDays||""}</td>
            <td>${s.ageMonths||""}</td>
            <td>${s.ageYears||""}</td>
            <td>${s.gender||""}</td>
            <td>${s.religion||""}</td>
            <td>${s.guardian||""}</td>
            <td>${s.guardianJob||""}</td>
            <td>${s.status||""}</td>
            <td>${s.address||""}</td>
            <td>${s.school||""}</td>
            <td>${s.total||""}</td>
            <td>${s.mother||""}</td>
            <td>${s.fatherNID||""}</td>
            <td>${s.motherNID||""}</td>
            <td>${s.grade||""}</td>
            <td>${s.studentEmail||""}</td>
            <td>${s.studentPassword||""}</td>
          </tr>`;
        });
        table += "</table>";
        document.getElementById("result").innerHTML = table;
      });
  }

  // 🟢 دالة التصدير لإكسل
  function exportExcel() {
    const table = document.querySelector("table");
    if (!table) { alert("⚠️ لا توجد بيانات لتصديرها"); return; }
    const wb = XLSX.utils.table_to_book(table, {sheet:"Students"});
    XLSX.writeFile(wb, "students.xlsx");
  }

  // 🟢 دالة الطباعة
  function printReport() {
    const content = document.getElementById("result").innerHTML;
    if (!content) { alert("⚠️ لا توجد بيانات للطباعة"); return; }
    const printWindow = window.open('', '', 'height=842,width=595');
    printWindow.document.write('<html><head><title>تقرير الطلاب</title>');
    printWindow.document.write(`
      <style>
        @page { size: A4; margin: 20mm; }
        body { font-family: Tahoma; direction: rtl; text-align: right; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 6px; text-align: center; }
        th { background: #007bff; color: #fff; }
      </style>
    `);
    printWindow.document.write('</head><body>');
    printWindow.document.write('<h2 style="text-align:center">📋 تقرير الطلاب</h2>');
    printWindow.document.write(content);
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.print();
  }
</script>
</body>
</html>
