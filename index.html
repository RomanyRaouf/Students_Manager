<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>إدارة شئون الطلاب</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {font-family: Tahoma; background:#f4f6f9; direction:rtl; text-align:right;}
    .container {width:900px; margin:40px auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
    h2 {text-align:center; color:#333;}
    label {display:block; margin:10px 0 5px; font-weight:bold;}
    input, select {width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;}
    button {margin-top:15px; padding:10px 15px; background:#007bff; color:#fff; border:none; border-radius:6px; cursor:pointer;}
    button:hover {background:#0056b3;}
    #result {margin-top:20px; padding:10px; background:#e9ecef; border-radius:6px;}
    table {margin-top:20px; border:1px solid #ccc; width:100%; border-collapse:collapse; text-align:center;}
    th, td {padding:8px; border:1px solid #ccc;}
    tr:nth-child(even){background:#f9f9f9;}
    tr:hover{background:#e0f0ff;}
    th{background:#007bff; color:#fff;}
  </style>
</head>
<body>
  <div class="container">
    <h2>📊  إدارة شئون الطلاب</h2>
    <h2>إعداد روماني رؤوف 01033353302</h2>
    <div id="studentsTable"></div>
    <h2>➕ إضافة طالب جديد</h2>
    <form id="studentForm">
      <label>الاسم:</label><input type="text" id="name">
      <label>الكود:</label><input type="text" id="studentCode">
      <label>الرقم القومي:</label>
<input type="text" id="nid" onkeyup="autoFillFromNID()">

      <label>تاريخ الميلاد:</label><input type="text" id="birthdate">
      <label>النوع:</label>
      <select id="gender">
        <option value="">-- اختر --</option>
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>
      <label>السن (أيام/شهور/سنوات):</label>
      <input type="text" id="ageDays" placeholder="أيام">
      <input type="text" id="ageMonths" placeholder="شهور">
      <input type="text" id="ageYears" placeholder="سنوات">
      <label>اسم ولي الأمر:</label><input type="text" id="guardian">
      <label>وظيفة ولي الأمر:</label><input type="text" id="guardianJob">
      <label>تليفون ولي الأمر:</label><input type="text" id="guardianPhone">
      <label>تليفون الطالب:</label><input type="text" id="studentPhone">
      <label>الحالة الاجتماعية:</label>
      <select id="status">
        <option value="">-- اختر --</option>
        <option value="شئون">شئون</option>
        <option value="أيتام">أيتام</option>
        <option value="أبناء عاملين">أبناء عاملين</option>
        <option value="تنمية مجتمع">تنمية مجتمع</option>
      </select>
      <label>الموقف من الدمج:</label>
      <select id="mergeStatus" onchange="toggleDisability()">
        <option value="">-- اختر --</option>
        <option value="عادي">عادي</option>
        <option value="دمج">دمج</option>
      </select>
      <div id="disabilityDiv" style="display:none;">
        <label>نوع الإعاقة:</label><input type="text" id="disability">
      </div>
      <label>اسم الأم:</label><input type="text" id="mother">
      <label>الفصل:</label><input type="text" id="classroom">
      <label>اللغة الثانية:</label>
      <select id="secondLang">
        <option value="">-- اختر --</option>
        <option value="فرنسي">فرنسي</option>
        <option value="ألماني">ألماني</option>
      </select>
      <button type="button" onclick="addStudent()">➕ إضافة الطالب</button>
    </form>
    <h2>🔍 بحث متقدم</h2>
    <label>الاسم:</label><input type="text" id="searchName">
    <label>الفصل:</label><input type="text" id="searchClassroom">
    <label>النوع:</label>
    <select id="searchGender">
      <option value="">-- اختر --</option>
      <option value="ذكر">ذكر</option>
      <option value="أنثى">أنثى</option>
    </select>
    <button onclick="searchStudent()">بحث</button>
    <button onclick="exportExcel()">📤 تصدير لإكسل</button>
    <button onclick="printReport()">🖨️ طباعة التقرير</button>
    <div id="result"></div>
  </div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyf97wGyA9YnC-pPAktkawRYO4DRYVYdPk053_TxxuhfI6MIYeJuWHIpiZk10hKIyJM/exec";

function toggleDisability() {
  const mergeStatus = document.getElementById("mergeStatus").value;
  document.getElementById("disabilityDiv").style.display = (mergeStatus==="دمج") ? "block" : "none";
}

function addStudent() {
  const student = {
    name: document.getElementById("name").value.trim(),
    studentCode: document.getElementById("studentCode").value.trim(),
    nid: document.getElementById("nid").value.trim(),
    birthdate: document.getElementById("birthdate").value.trim(),
    gender: document.getElementById("gender").value,
    ageDays: document.getElementById("ageDays").value.trim(),
    ageMonths: document.getElementById("ageMonths").value.trim(),
    ageYears: document.getElementById("ageYears").value.trim(),
    guardian: document.getElementById("guardian").value.trim(),
    guardianJob: document.getElementById("guardianJob").value.trim(),
    guardianPhone: document.getElementById("guardianPhone").value.trim(),
    studentPhone: document.getElementById("studentPhone").value.trim(),
    status: document.getElementById("status").value,
    mergeStatus: document.getElementById("mergeStatus").value,
    disability: document.getElementById("disability").value.trim(),
    mother: document.getElementById("mother").value.trim(),
    classroom: document.getElementById("classroom").value.trim(),
    secondLang: document.getElementById("secondLang").value
  };

  fetch(API_URL, {method:"POST", body:JSON.stringify(student)})
    .then(res=>res.text())
    .then(msg=>{
      document.getElementById("result").innerText=msg;
      loadStudents();
      document.getElementById("studentForm").reset();
    })
    .catch(err=>{
      document.getElementById("result").innerText="❌ خطأ في الاتصال بالشيت";
      console.error(err);
    });
}
  
function autoFillFromNID() {
  const nid = document.getElementById("nid").value.trim();
  if(nid.length !== 14) return; // لازم 14 رقم

  // استخراج تاريخ الميلاد
  let century = (nid[0] === "2") ? 1900 : 2000;
  let year = century + parseInt(nid.substr(1,2));
  let month = parseInt(nid.substr(3,2));
  let day = parseInt(nid.substr(5,2));

  let birthdate = new Date(year, month-1, day);
  document.getElementById("birthdate").value = `${day}/${month}/${year}`;

  // استخراج النوع
  let genderDigit = parseInt(nid[12]);
  let gender = (genderDigit % 2 === 0) ? "أنثى" : "ذكر";
  document.getElementById("gender").value = gender;

  // حساب العمر حتى 1-10
  let today = new Date(new Date().getFullYear(), 9, 1); // 1 أكتوبر
  let ageYears = today.getFullYear() - birthdate.getFullYear();
  let ageMonths = today.getMonth() - birthdate.getMonth();
  let ageDays = today.getDate() - birthdate.getDate();

  if(ageDays < 0) {
    ageMonths--;
    ageDays += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
  }
  if(ageMonths < 0) {
    ageYears--;
    ageMonths += 12;
  }

  document.getElementById("ageYears").value = ageYears;
  document.getElementById("ageMonths").value = ageMonths;
  document.getElementById("ageDays").value = ageDays;
}

function loadStudents() {
  fetch(API_URL+"?search=all")
    .then(res=>res.json())
    .then(data=>{
      let table="<table><tr><th>الاسم</th><th>الفصل</th><th>النوع</th></tr>";
      data.forEach(s=>{
        table+=`<tr>
          <td>${s.name||""}</td>
          <td>${s.classroom||""}</td>
          <td>${s.gender||""}</td>
        </tr>`;
      });
      table+="</table>";
      document.getElementById("studentsTable").innerHTML=table;
    })
    .catch(err=>{
      document.getElementById("studentsTable").innerText="❌ خطأ في تحميل البيانات";
      console.error(err);
    });
}

function searchStudent() {
  const name = document.getElementById("searchName").value.trim();
  const classroom = document.getElementById("searchClassroom").value.trim();
  const gender = document.getElementById("searchGender").value;

  fetch(API_URL+"?search=all")
    .then(res=>res.json())
    .then(data=>{
      let filtered = data.filter(s=>{
        return (!name || (s.name && s.name.includes(name))) &&
               (!classroom || (s.classroom && String(s.classroom).includes(classroom))) &&
               (!gender || s.gender===gender);
      });

      if(filtered.length === 0){
        document.getElementById("studentsTable").innerHTML = "<p>⚠️ لا توجد نتائج مطابقة</p>";
        return;
      }

      let table="<table><tr><th>الاسم</th><th>الفصل</th><th>النوع</th></tr>";
      filtered.forEach(s=>{
        table+=`<tr>
          <td>${s.name||""}</td>
          <td>${s.classroom||""}</td>
          <td>${s.gender||""}</td>
        </tr>`;
      });
      table+="</table>";
      document.getElementById("studentsTable").innerHTML=table;
    })
    .catch(err=>{
      document.getElementById("studentsTable").innerText="❌ خطأ في الاتصال بالشيت";
      console.error(err);
    });
}

function exportExcel() {
  const table=document.querySelector("#studentsTable table");
  if(!table){alert("⚠️ لا توجد بيانات لتصديرها");return;}
  const wb=XLSX.utils.table_to_book(table,{sheet:"Students"});
  XLSX.writeFile(wb,"students.xlsx");
}

function printReport() {
  const content=document.getElementById("studentsTable").innerHTML;
  if(!content){alert("⚠️ لا توجد بيانات للطباعة");return;}
  const printWindow=window.open('','','height=842,width=595');
  printWindow.document.write('<html><head><title>تقرير الطلاب</title>');
  printWindow.document.write('<style>@page{size:A4;margin:20mm;}body{font-family:Tahoma;direction:rtl;text-align:right;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:6px;text-align:center;}th{background:#007bff;color:#fff;}</style>');
  printWindow.document.write('</head><body><h2 style="text-align:center">📋 تقرير الطلاب</h2>');
  printWindow.document.write(content);
  printWindow.document.write('</body></html>');
  printWindow.document.close();
  printWindow.print();
}

window.onload = loadStudents;
</script>
</body>
</html>
